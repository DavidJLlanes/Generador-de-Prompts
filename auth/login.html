<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#17130f">
  <title>Acceso · Lumen Vitae</title>
  <style>
    :root{color-scheme:dark;--bg:#100e0c;--panel:#1d1915;--line:#403831;--text:#f1e8da;--muted:#b8ad9e;--gold:#dfbc82;--ink:#21180e}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#30241a 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,440px);padding:36px;border:1px solid var(--line);border-radius:28px;background:#1d1915f5;box-shadow:0 24px 80px #0008}.brand{margin:0 0 30px;color:var(--gold);font:italic 24px/1.2 Georgia,serif}.brand span{font-style:normal;color:var(--text)}h1{margin:0 0 8px;font:42px/1.1 Georgia,serif;letter-spacing:-1px}.intro{margin:0 0 28px;color:var(--muted)}button,.secondary{display:flex;width:100%;min-height:56px;align-items:center;justify-content:center;margin-top:14px;padding:12px 16px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);font:600 16px system-ui;text-decoration:none;cursor:pointer}.secondary{border:1px solid var(--line);background:transparent;color:var(--text)}button:disabled{opacity:.6;cursor:wait}.notice{min-height:25px;margin:18px 0 0;color:var(--muted);text-align:center}.notice.error{color:#ffd1c7}.privacy{margin:22px 0 0;color:var(--muted);font-size:13px;text-align:center}
    @media(max-width:480px){main{padding:28px 22px;border-radius:22px}h1{font-size:36px}}
  </style>
</head>
<body>
  <main>
    <p class="brand">✦ <span>Lumen</span> Vitae</p>
    <h1>Tu espacio creativo</h1>
    <p class="intro">Entra de forma segura con la passkey de este dispositivo.</p>
    <button id="unlock" type="button">Entrar con Face ID o huella</button>
    <a class="secondary" href="/prompt/enroll">Configurar o añadir un dispositivo</a>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <p class="privacy">El acceso biométrico lo valida tu dispositivo. Lumen Vitae no recibe ni guarda tu huella o tu rostro.</p>
  </main>
  <script type="module">
    const button = document.querySelector('#unlock');
    const notice = document.querySelector('#notice');
    const b64urlToBytes = value => {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      return Uint8Array.from(atob(padded), char => char.charCodeAt(0));
    };
    const bytesToB64url = value => {
      const bytes = new Uint8Array(value);
      let binary = '';
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const responseToJSON = credential => ({
      id: credential.id,
      rawId: bytesToB64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bytesToB64url(credential.response.clientDataJSON),
        authenticatorData: bytesToB64url(credential.response.authenticatorData),
        signature: bytesToB64url(credential.response.signature),
        userHandle: credential.response.userHandle ? bytesToB64url(credential.response.userHandle) : null,
        transports: credential.response.getTransports?.() || [],
      },
      clientExtensionResults: credential.getClientExtensionResults(),
    });

    async function request(path, options = {}) {
      const response = await fetch(path, { credentials: 'same-origin', cache: 'no-store', ...options });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Error ${response.status}`);
      return data;
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      notice.classList.remove('error');
      notice.textContent = 'Confirma tu identidad en el dispositivo…';
      try {
        if (!window.PublicKeyCredential || !navigator.credentials) throw new Error('Este navegador no admite passkeys. Abre la web en Safari o Chrome actualizado.');
        const options = await request('/prompt/auth/login/options');
        options.challenge = b64urlToBytes(options.challenge);
        options.allowCredentials = (options.allowCredentials || []).map(item => ({ ...item, id: b64urlToBytes(item.id) }));
        const credential = await navigator.credentials.get({ publicKey: options });
        if (!credential) throw new Error('No se recibió una passkey.');
        await request('/prompt/auth/login/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(responseToJSON(credential)),
        });
        window.location.replace('/prompt/');
      } catch (error) {
        notice.textContent = error.name === 'NotAllowedError' ? 'Acceso cancelado. Toca el botón para intentarlo otra vez.' : error.message;
        notice.classList.add('error');
        button.disabled = false;
      }
    });

    request('/prompt/auth/status').then(result => {
      if (result.authenticated) window.location.replace('/prompt/');
    }).catch(() => {});
  </script>
</body>
</html>
